[package]
name = "amate-spike"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "Throwaway spike: can egui/eframe carry Amate's code-editor view?"

[dependencies]
# Same toolkit setup as master: glow (86 MB private memory vs 525 MB with wgpu) and no
# default_fonts (they bundle OFL-1.1 and Ubuntu-font-1.0 fonts); text uses system fonts.
eframe = { version = "0.37", default-features = false, features = [
  "accesskit",
  "clipboard",
  "system_fonts",
  "wayland",
  "x11",
  "glow",
] }
# Only to keep the winit features eframe's defaults enable (runtime libwayland, GNOME CSD).
winit = { version = "0.30.13", default-features = false, features = [
  "wayland-dlopen",
  "wayland-csd-adwaita",
] }
regex = "1"
# Pure-Rust regex backend (fancy-regex), never onig (C). default-syntaxes implies parsing.
syntect = { version = "5", default-features = false, features = [
  "default-syntaxes",
  "default-themes",
  "regex-fancy",
] }

[lints.rust]
unsafe_code = "forbid"
